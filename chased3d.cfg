# DOS 2.5-compatible Atari XEX configuration for Chased3D.
# Adds an aligned SCREEN segment: ANTIC cannot fetch display data across a 4K
# boundary, and a display list cannot cross a 1K boundary.
FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0800;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0082, size = $007E;
    MAIN: file = %O, define = yes, start = %S,
          size = $A000 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp, optional = yes;
    STARTUP:  load = MAIN, type = ro, define = yes;
    LOWBSS:   load = MAIN, type = rw, optional = yes;
    LOWCODE:  load = MAIN, type = ro, define = yes, optional = yes;
    ONCE:     load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro, define = yes;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    INIT:     load = MAIN, type = bss, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes, align = $0002;
    DLIST:    load = MAIN, type = bss, align = $0400, optional = yes;
    SCREEN:   load = MAIN, type = bss, align = $1000, optional = yes;
}
FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import = __CALLIRQ__;
}
