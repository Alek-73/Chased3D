# DOS 2.5-compatible Atari XEX configuration for Chased3D.
# Reserve the memory above $A000 from cc65's software stack, then use the RAM
# beneath BASIC for aligned video storage and explicitly initialized data.
FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0400;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $1C20;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0082, size = $007E;
    PAGE6: file = %O, define = yes, start = $0600, size = $0100;
    MAIN: file = %O, define = yes, start = %S,
          size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;
    BASICSCREEN: file = "", define = yes, start = $A000, size = $1000;
    BASICDLIST:  file = "", define = yes, start = $B000, size = $0400;
    BASICPMG:    file = "", define = yes, start = $B400, size = $0400;
    BASICHIGH:   file = "", define = yes, start = $B800, size = $0800;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = basic_off_start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp, optional = yes;
    PAGE6CODE: load = PAGE6, type = ro, optional = yes;
    PAGE6DATA: load = PAGE6, type = ro, optional = yes;
    PAGE6BSS:  load = PAGE6, type = bss, optional = yes;
    STARTUP:  load = MAIN, type = ro, define = yes;
    LOWBSS:   load = MAIN, type = rw, optional = yes;
    LOWCODE:  load = MAIN, type = ro, define = yes, optional = yes;
    ONCE:     load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro, define = yes;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    INIT:     load = MAIN, type = bss, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes, align = $0002;
    SCREEN:   load = BASICSCREEN, type = bss, optional = yes;
    DLIST:    load = BASICDLIST, type = bss, optional = yes;
    AUXBSS:   load = BASICDLIST, type = bss, optional = yes;
    PMGRAM:   load = BASICPMG, type = bss, optional = yes;
    HIGHBSS:  load = BASICHIGH, type = bss, optional = yes;
}
FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import = __CALLIRQ__;
}
